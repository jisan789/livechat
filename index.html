<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Live Chat - Jack King</title>
  <meta name="description" content="Clean mobile chat application UI with free random avatar API integration.">
  <link rel="stylesheet" href="static/style.css?v=1.3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mobile Chat Application UI -->
  <div class="chat-app" id="chatApp">
    
    <!-- Subtle curved watermark vector background -->
    <div class="background-watermark" aria-hidden="true">
      <svg viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-50 150 C 150 120, 300 350, 450 300" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 4"/>
        <path d="M-80 400 C 100 480, 250 380, 480 620" stroke="#CBD5E1" stroke-width="1.2"/>
        <path d="M-20 700 C 180 620, 220 780, 450 740" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 3"/>
        <path d="M120 -50 C 200 200, 50 450, 220 850" stroke="#E2E8F0" stroke-width="1"/>
      </svg>
    </div>

    <!-- Chat Header Navigation with Live Opponent Typing Status -->
    <header class="chat-header" aria-label="Conversation Header">
      <div class="header-left">
        <!-- Avatar with Free API source (Click to fetch new random avatar silently) -->
        <div class="avatar-wrapper" id="avatarWrapper" title="Click to get new random avatar">
          <img id="avatarImg" class="avatar-img" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=256" alt="Jack King Avatar">
          <span class="avatar-badge" aria-label="Online"></span>
        </div>

        <!-- Contact Info (Shows live typing status when opponent types) -->
        <div class="user-info">
          <h1 class="user-name" id="userName">Jack king</h1>
          <span class="user-status" id="userStatus">Online</span>
        </div>
      </div>

      <!-- Header Actions: Typing Sound Toggle & Audio Call -->
      <div class="header-actions">
        <button class="action-icon-btn" id="soundToggleBtn" aria-label="Toggle opponent typing sound" title="Opponent typing sound enabled (Click to mute)">
          <!-- Sound ON Icon -->
          <svg class="sound-on-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <!-- Sound OFF Icon -->
          <svg class="sound-off-icon" style="display: none;" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <button class="action-icon-btn" id="lockAppBtn" aria-label="Lock App / Switch User" title="Lock App">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
        <button class="action-icon-btn" id="voiceCallBtn" aria-label="Start Audio Call" title="Audio Call">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Minimized Ongoing Call Indicator Banner -->
    <div class="minimized-call-banner" id="minimizedCallBanner" role="status" aria-live="polite">
      <div class="minimized-call-content">
        <div class="minimized-call-left">
          <div class="minimized-call-icon-wrap">
            <span class="minimized-call-pulse"></span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
          </div>
          <div class="minimized-call-info">
            <span class="minimized-call-title">Call in progress • Tap to return</span>
            <span class="minimized-call-timer" id="minimizedCallTimer">00:00</span>
          </div>
        </div>
        <button class="minimized-end-btn" id="minimizedEndCallBtn" aria-label="End call" title="End call">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.84 7.42 7 12 7s8.72 1.84 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Chat Messages Scroll Container -->
    <main class="chat-body" id="chatMessages" role="log" aria-live="polite">
      
      <!-- Date Badge -->
      <div class="date-divider" id="chatDateDivider">Today</div>

      <!-- Live Real-Time Typing Preview of Opponent's Input -->
      <div class="message-row incoming live-preview-row" id="livePreviewRow">
        <div class="bubble-group">
          <div class="bubble live-preview-bubble">
            <div class="live-preview-header">
              <span class="live-preview-dot"></span>
              <span class="live-preview-label" id="livePreviewLabel">Typing...</span>
            </div>
            <div class="live-preview-body">
              <span class="live-preview-text" id="livePreviewText"></span>
              <span class="streaming-cursor"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Live Typing Indicator for Opponent User -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>

    </main>

    <!-- Bottom Input Area -->
    <footer class="chat-footer" id="chatFooter">
      <div class="input-container">
        
        <!-- Input Pill -->
        <div class="input-pill" id="inputPill">
          
          <!-- Normal Input Content -->
          <div class="input-normal-content" id="inputNormalContent">
            <!-- Emoji Picker Trigger -->
            <button class="input-icon-btn" id="emojiBtn" aria-label="Insert Emoji" type="button">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </button>

            <!-- Input Text Field -->
            <input type="text" id="chatInput" class="chat-input" placeholder="Enter Text" autocomplete="off" enterkeyhint="send">
          </div>

          <!-- Live Recording State Inside Pill -->
          <div class="input-recording-content" id="inputRecordingContent">
            <div class="recording-badge">
              <span class="recording-pulse-dot"></span>
              <span class="recording-timer" id="recordingTimer">0:00</span>
            </div>
            <div class="recording-live-waveform">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="cancel-record-btn" id="cancelRecordBtn" type="button" aria-label="Cancel Voice Recording" title="Cancel">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

        </div>

        <!-- Separate Mic / Send / Record Stop Button -->
        <button class="mic-btn" id="actionBtn" aria-label="Record voice message or Send" type="button" title="Record Voice">
          <span id="actionIcon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </span>
        </button>

      </div>
    </footer>



    <!-- Emoji Popover -->
    <div class="emoji-popover" id="emojiPopover">
      <button class="emoji-btn">👍</button>
      <button class="emoji-btn">❤️</button>
      <button class="emoji-btn">😊</button>
      <button class="emoji-btn">🏠</button>
      <button class="emoji-btn">🔑</button>
      <button class="emoji-btn">✨</button>
      <button class="emoji-btn">📅</button>
      <button class="emoji-btn">🤝</button>
      <button class="emoji-btn">📍</button>
      <button class="emoji-btn">💯</button>
      <button class="emoji-btn">👋</button>
      <button class="emoji-btn">🔥</button>
    </div>

    <!-- Audio Call Overlay Modal (Modern White Theme) -->
    <div class="call-modal white-theme" id="callModal">
      
      <!-- Top Bar with Minimize & Security Info -->
      <div class="call-top-bar">
        <button class="call-top-btn" id="callMinimizeBtn" aria-label="Minimize Call" title="Minimize">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="call-type-badge">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>End-to-end Encrypted</span>
        </div>
        <div style="width: 38px;"></div>
      </div>

      <!-- Center Profile & Status -->
      <div class="call-header">
        <div class="call-avatar-wrapper">
          <div class="call-pulse-ring"></div>
          <div class="call-pulse-ring delay"></div>
          <img id="callAvatar" class="call-avatar" src="" alt="Call avatar">
        </div>
        <h2 id="callName" class="call-name">Jack king</h2>
        <div class="call-status-pill" id="callStatusPill">
          <span class="call-status-dot" id="callStatusDot"></span>
          <span id="callStatus">Calling...</span>
        </div>
      </div>
      
      <!-- Bottom Control Actions (White Theme iOS Style) -->
      <div class="call-controls-wrapper">
        <div class="call-secondary-actions">
          <!-- Mic Toggle -->
          <div class="call-control-item">
            <button class="call-btn-circle" id="callMicToggleBtn" aria-label="Mute Microphone" title="Mute">
              <svg id="micIconNormal" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="22"></line>
              </svg>
            </button>
            <span class="call-action-label" id="micLabel">Mute</span>
          </div>

          <!-- Speaker Toggle -->
          <div class="call-control-item">
            <button class="call-btn-circle" id="callSpeakerBtn" aria-label="Toggle Speaker" title="Speaker">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
            </button>
            <span class="call-action-label">Speaker</span>
          </div>

          <!-- Keypad / Messages -->
          <div class="call-control-item">
            <button class="call-btn-circle" id="callChatBackBtn" aria-label="Chat" title="Chat">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <span class="call-action-label">Chat</span>
          </div>
        </div>

        <!-- Red End Call Handset Button -->
        <div class="call-end-wrapper">
          <button class="call-btn-end" id="endCallBtn" aria-label="End Call" title="End Call">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.84 7.42 7 12 7s8.72 1.84 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

    <!-- Personal PIN Input Pad Overlay (Jisu: 1470 • Jenu: 3690) -->
    <div class="pin-overlay" id="pinOverlay">
      <div class="pin-card">
        <div class="pin-header">
          <div class="pin-lock-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2 class="pin-title">Enter Passcode</h2>
        </div>

        <!-- 4 PIN Dots Indicator -->
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <div class="pin-feedback" id="pinFeedback"></div>

        <!-- Numeric Keypad -->
        <div class="pin-keypad">
          <button type="button" class="pin-key" data-digit="1">1</button>
          <button type="button" class="pin-key" data-digit="2">2</button>
          <button type="button" class="pin-key" data-digit="3">3</button>
          <button type="button" class="pin-key" data-digit="4">4</button>
          <button type="button" class="pin-key" data-digit="5">5</button>
          <button type="button" class="pin-key" data-digit="6">6</button>
          <button type="button" class="pin-key" data-digit="7">7</button>
          <button type="button" class="pin-key" data-digit="8">8</button>
          <button type="button" class="pin-key" data-digit="9">9</button>
          <div class="pin-key-empty"></div>
          <button type="button" class="pin-key" data-digit="0">0</button>
          <button type="button" class="pin-key pin-back-key" id="pinBackspaceBtn" aria-label="Delete">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ══ Incoming Call Ringing Overlay ══ -->
    <div class="incoming-call-overlay" id="incomingCallOverlay" role="dialog" aria-label="Incoming call">
      <div class="incoming-call-card">
        <!-- Animated pulse rings -->
        <div class="incoming-pulse-rings">
          <div class="ipr ipr-1"></div>
          <div class="ipr ipr-2"></div>
          <div class="ipr ipr-3"></div>
        </div>
        <!-- Caller Info -->
        <img class="incoming-caller-avatar" id="incomingCallerAvatar" src="" alt="Caller">
        <div class="incoming-call-label">Incoming call</div>
        <div class="incoming-caller-name" id="incomingCallerName">Caller</div>
        <!-- Action Buttons -->
        <div class="incoming-call-actions">
          <div class="incoming-action-item">
            <button class="incoming-btn reject-btn" id="rejectCallBtn" aria-label="Reject call">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.28 8.84 7.42 7 12 7s8.72 1.84 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
              </svg>
            </button>
            <span class="incoming-action-label">Decline</span>
          </div>
          <div class="incoming-action-item">
            <button class="incoming-btn accept-btn" id="acceptCallBtn" aria-label="Accept call">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
              </svg>
            </button>
            <span class="incoming-action-label">Accept</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="static/app.js?v=1.3"></script>
</body>
</html>
