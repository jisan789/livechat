<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Live Chat - Jack King</title>
  <meta name="description" content="Clean mobile chat application UI with free random avatar API integration.">
  <link rel="stylesheet" href="static/style.css?v=2.2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Mobile Chat Application UI -->
  <div class="chat-app" id="chatApp">
    
    <!-- Subtle curved watermark vector background -->
    <div class="background-watermark" aria-hidden="true">
      <svg viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M-50 150 C 150 120, 300 350, 450 300" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 4"/>
        <path d="M-80 400 C 100 480, 250 380, 480 620" stroke="#CBD5E1" stroke-width="1.2"/>
        <path d="M-20 700 C 180 620, 220 780, 450 740" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="2 3"/>
        <path d="M120 -50 C 200 200, 50 450, 220 850" stroke="#E2E8F0" stroke-width="1"/>
      </svg>
    </div>

    <!-- Chat Header Navigation with Live Opponent Typing Status -->
    <header class="chat-header" aria-label="Conversation Header">
      <div class="header-left">
        <!-- Avatar with Free API source (Click to fetch new random avatar silently) -->
        <div class="avatar-wrapper" id="avatarWrapper" title="Click to get new random avatar">
          <img id="avatarImg" class="avatar-img" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=256" alt="Jack King Avatar">
          <span class="avatar-badge" aria-label="Online"></span>
        </div>

        <!-- Contact Info (Shows live typing status when opponent types) -->
        <div class="user-info">
          <h1 class="user-name" id="userName">Jack king</h1>
          <span class="user-status" id="userStatus">Online</span>
        </div>
      </div>

      <!-- Header Actions: Sound, Clear Chat & Lock App -->
      <div class="header-actions">
        <!-- Tiny Unfocused External Link to LiveDraw -->
        <a href="https://livedrawing.onrender.com/" target="_blank" rel="noopener noreferrer" class="tiny-external-btn" id="liveDrawingBtn" aria-label="Open LiveDraw" title="LiveDraw">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
        </a>
        <button class="action-icon-btn" id="soundToggleBtn" aria-label="Toggle opponent typing sound" title="Opponent typing sound enabled (Click to mute)">
          <!-- Sound ON Icon -->
          <svg class="sound-on-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <!-- Sound OFF Icon -->
          <svg class="sound-off-icon" style="display: none;" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <button class="action-icon-btn" id="clearChatBtn" aria-label="Clear Chat History" title="Clear Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button class="action-icon-btn" id="lockAppBtn" aria-label="Lock App / Switch User" title="Lock App">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Chat Messages Scroll Container -->
    <main class="chat-body" id="chatMessages" role="log" aria-live="polite">
      
      <!-- Date Badge -->
      <div class="date-divider" id="chatDateDivider">Today</div>

      <!-- Live Typing Indicator for Opponent User -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>

    </main>

    <!-- Bottom Input Area -->
    <footer class="chat-footer" id="chatFooter">
      <div class="input-container">
        
        <!-- Input Pill -->
        <div class="input-pill" id="inputPill">
          <div class="input-normal-content" id="inputNormalContent">
            <!-- Emoji Picker Trigger -->
            <button class="input-icon-btn" id="emojiBtn" aria-label="Insert Emoji" type="button">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </button>

            <!-- Input Text Field -->
            <input type="text" id="chatInput" class="chat-input" placeholder="Enter Text" autocomplete="off" enterkeyhint="send">
          </div>
        </div>

        <!-- Send Button -->
        <button class="send-btn" id="actionBtn" aria-label="Send Message" type="button" title="Send">
          <span id="actionIcon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </span>
        </button>

      </div>
    </footer>



    <!-- Emoji Popover -->
    <div class="emoji-popover" id="emojiPopover">
      <button class="emoji-btn">👍</button>
      <button class="emoji-btn">❤️</button>
      <button class="emoji-btn">😊</button>
      <button class="emoji-btn">🏠</button>
      <button class="emoji-btn">🔑</button>
      <button class="emoji-btn">✨</button>
      <button class="emoji-btn">📅</button>
      <button class="emoji-btn">🤝</button>
      <button class="emoji-btn">📍</button>
      <button class="emoji-btn">💯</button>
      <button class="emoji-btn">👋</button>
      <button class="emoji-btn">🔥</button>
    </div>

    <!-- Personal PIN Input Pad Overlay (Jisu: 1470 • Jenu: 3690) -->
    <div class="pin-overlay" id="pinOverlay">
      <div class="pin-card">
        <div class="pin-header">
          <div class="pin-lock-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <h2 class="pin-title">Enter Passcode</h2>
        </div>

        <!-- 4 PIN Dots Indicator -->
        <div class="pin-dots" id="pinDots">
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <div class="pin-feedback" id="pinFeedback"></div>

        <!-- Numeric Keypad -->
        <div class="pin-keypad">
          <button type="button" class="pin-key" data-digit="1">1</button>
          <button type="button" class="pin-key" data-digit="2">2</button>
          <button type="button" class="pin-key" data-digit="3">3</button>
          <button type="button" class="pin-key" data-digit="4">4</button>
          <button type="button" class="pin-key" data-digit="5">5</button>
          <button type="button" class="pin-key" data-digit="6">6</button>
          <button type="button" class="pin-key" data-digit="7">7</button>
          <button type="button" class="pin-key" data-digit="8">8</button>
          <button type="button" class="pin-key" data-digit="9">9</button>
          <div class="pin-key-empty"></div>
          <button type="button" class="pin-key" data-digit="0">0</button>
          <button type="button" class="pin-key pin-back-key" id="pinBackspaceBtn" aria-label="Delete">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="static/app.js?v=2.4"></script>
</body>
</html>
